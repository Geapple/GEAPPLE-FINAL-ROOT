name: UNZIP GEAPPLE 33
on: push
permissions:
  contents: write
jobs:
  unzip:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
      - name: BUILD 33 APPS
        run: |
          python3 build_all_33.py
          ls -1 *.html
          rm -rf GEAPPLE.COM geapple-super-pro-max GEAPPLE_33.zip builder.html unzip.yml
          ls -1 *.html
      - name: PUSH CLEAN ROOT
        run: |
          git config user.name "Geapple"
          git config user.email "geapple@bot.com"
          git add .
          git commit -m "FINAL 33 V3 96% - CLEAN ROOT NO HOLO" || true
          git push
