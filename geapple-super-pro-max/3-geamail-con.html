<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>GEAMAIL.CON PRO MAX</title><meta name="theme-color" content="#00e5ff"><style>body{background:radial-gradient(ellipse at top,#001a1a,#000 70%);color:#fff;margin:0;font-family:Segoe UI;padding-bottom:80px}.holo{background:rgba(0,20,20,0.7);backdrop-filter:blur(20px);border:1px solid rgba(0,229,255,0.3);box-shadow:0 0 30px rgba(0,229,255,0.25);border-radius:24px;margin:12px;padding:16px}.logo{width:78px;height:78px;border-radius:50%;border:3px solid #00e5ff;box-shadow:0 0 25px #00e5ff;display:block;margin:12px auto}.in{width:100%;padding:12px;background:#000;border:1px solid rgba(0,229,255,0.4);border-radius:12px;color:#fff;margin:6px 0}.btn{width:100%;padding:14px;border:none;border-radius:30px;font-weight:900;background:linear-gradient(90deg,#00e5ff,#00ff88);color:#000;margin:8px 0}</style></head><body>
<img src="./logo.png" class="logo"><div style="text-align:center"><h2 style="color:#00e5ff">3- GEAMAIL.CON®™ SUPER PRO MAX</h2><p style="font-size:10px;color:#aaa">HOLO GATE 50-100 ACTIVE | ENCRYPTED | CEO: Apostle Dr Oladele Mighty Hassan PhD/DD</p></div>
<div class="holo"><div style="display:flex;gap:8px"><button class="btn" style="flex:1;padding:10px" onclick="show('compose')">✍️ COMPOSE</button><button class="btn" style="flex:1;padding:10px;background:linear-gradient(90deg,#111,#333);color:#00e5ff;border:1px solid #00e5ff" onclick="show('inbox')">📥 INBOX <span id="cnt">0</span></button><button class="btn" style="flex:1;padding:10px;background:linear-gradient(90deg,#111,#333);color:#00e5ff;border:1px solid #00e5ff" onclick="show('sent')">📤 SENT</button></div>
<div id="composeBox"><input id="to" class="in" placeholder="To: name@geapple.con / @MYGEA-SOCIAL"><input id="subj" class="in" placeholder="Subject — HOLO Encrypted"><textarea id="body" class="in" style="height:120px" placeholder="Holo Message Body — Wrapped with GEAPPLE®™ Logo + AES-256"></textarea><div style="display:flex;gap:6px"><button class="btn" style="flex:1" onclick="send()">📧 SEND VIA HOLO GATE 50</button><button class="btn" style="flex:1;background:linear-gradient(90deg,#ffaa00,#ff6600)" onclick="payAndSend()">💳 PAY ₦100 VIA GEA-PAY — PRIORITY GATE 100</button></div></div>
<div id="inboxBox" style="display:none"><h3 style="color:#00e5ff">📥 INBOX — HOLO GATE</h3><div id="inboxList"></div></div>
<div id="sentBox" style="display:none"><h3 style="color:#00e5ff">📤 SENT</h3><div id="sentList"></div></div>
</div>
<script>
function show(t){composeBox.style.display=t=='compose'?'block':'none';inboxBox.style.display=t=='inbox'?'block':'none';sentBox.style.display=t=='sent'?'block':'none'; if(t=='inbox')renderInbox()}
function send(){
 let m={id:Date.now(),to:to.value,subj:subj.value,body:body.value,time:new Date().toLocaleString(),gate:50,encrypted:true};
 if(!m.to||!m.subj)return alert('Fill To & Subject');
 let s=JSON.parse(localStorage.getItem('geamail_sent_v2')||'[]');s.unshift(m);localStorage.setItem('geamail_sent_v2',JSON.stringify(s));
 let inbox=JSON.parse(localStorage.getItem('geamail_inbox_v2')||'[]');inbox.unshift({...m,from:'YOU'});localStorage.setItem('geamail_inbox_v2',JSON.stringify(inbox));
 alert('✅ GEAMAIL Sent via HOLO GATE 50 — Encrypted — Wrapped with GEAPPLE Logo'); to.value=subj.value=body.value=''; renderInbox();
}
function payAndSend(){localStorage.setItem('pending_geamail',JSON.stringify({to:to.value,subj:subj.value}));alert('Redirect to GEA-PAY — Pay ₦100 for PRIORITY GATE 100 — Instant Delivery + Read Receipt'); location.href='./29-gea-pay.html'}
function renderInbox(){let list=JSON.parse(localStorage.getItem('geamail_inbox_v2')||'[]');document.getElementById('cnt').innerText=list.length;document.getElementById('inboxList').innerHTML=list.map(m=>`<div style="border:1px solid #00e5ff44;border-radius:12px;padding:10px;margin:6px 0"><b>${m.subj}</b><br><small>From: ${m.from||m.to} • ${m.time} • GATE ${m.gate} • 🔐 Encrypted</small><br><p>${m.body}</p></div>`).join('')||'<small>No mails</small>';let sent=JSON.parse(localStorage.getItem('geamail_sent_v2')||'[]');document.getElementById('sentList').innerHTML=sent.map(m=>`<div style="border:1px solid #00e5ff44;border-radius:12px;padding:10px;margin:6px 0"><b>${m.subj}</b> → ${m.to}<br><small>${m.time}</small></div>`).join('')}
renderInbox();
</script></body></html>
