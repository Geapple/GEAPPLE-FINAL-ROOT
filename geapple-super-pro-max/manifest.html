function render(apps){
 let liveCount = apps.filter(a=>a.status==='LIVE').length;
 document.getElementById('statTotal').innerText = `📦 ${apps.length} APPS LOADED FROM apps-config.json`;
 document.getElementById('statLive').innerText = `✅ ${liveCount} LIVE`;
 document.getElementById('appsGrid').innerHTML = apps.map(a=>`
  <div class="app ${a.status.toLowerCase()}" onclick="openApp(${a.id})" style="border-color:${a.status==='LIVE'?(a.color||'#ffd700'):'#444'}">
   <img src="./logo.png" style="border-color:${a.color||'#555'}" onerror="this.src='https://geapple.com/logo.png'">
   <b>${a.emoji||'📱'} ${a.name}</b>
  </div>
 `).join('');
}

function openApp(id){
 let app = APPS_DATA.find(x=>x.id===id);
 if(!app) return;
 if(app.status==="LIVE"){
   // Direct redirect — Super Pro Max platform
   window.location.href = app.file;
 } else {
   // BUILD/SOON — Show Holo preview
   document.getElementById('holoTitle').innerText = app.name + ' — ' + app.status;
   document.getElementById('holoFrame').src = app.file;
   document.getElementById('holoWrap').style.display='block';
   // If file not exist yet, show placeholder
   setTimeout(()=>{
     try{
       let f = document.getElementById('holoFrame');
       if(f.contentDocument && f.contentDocument.body.innerHTML.includes('404')) throw 404;
     }catch(e){
