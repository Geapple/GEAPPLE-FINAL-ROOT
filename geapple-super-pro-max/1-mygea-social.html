<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>MYGEA-SOCIAL PRO MAX</title><link rel="manifest" href="./manifest-geapay.json"><meta name="theme-color" content="#00ff88"><style>body{background:radial-gradient(ellipse at top,#001a0a,#000 70%);color:#fff;margin:0;font-family:Segoe UI;padding-bottom:80px}.holo{background:rgba(10,20,10,0.7);backdrop-filter:blur(20px);border:1px solid rgba(0,255,136,0.3);box-shadow:0 0 30px rgba(0,255,136,0.25);border-radius:24px;margin:12px;padding:16px}.logo{width:78px;height:78px;border-radius:50%;border:3px solid #00ff88;box-shadow:0 0 25px #00ff88;display:block;margin:12px auto}.btn{background:linear-gradient(90deg,#00ff88,#00e5ff);border:none;padding:14px;border-radius:30px;width:100%;font-weight:900;color:#000;margin:8px 0}.post{background:#0f0f0f;border:1px solid rgba(0,255,136,0.2);border-radius:18px;padding:12px;margin:10px 0}.input{width:100%;padding:14px;background:#000;border:1px solid rgba(0,255,136,0.4);border-radius:14px;color:#fff;margin:6px 0}</style></head><body>
<img src="./logo.png" class="logo"><div style="text-align:center"><h2 style="color:#00ff88">1- MYGEA-SOCIAL®™ SUPER PRO MAX</h2><p style="font-size:10px;color:#aaa">RC:9882150 | CEO: Apostle Dr Oladele Mighty Hassan PhD/DD</p></div>
<div class="holo"><div style="display:flex;gap:8px"><img src="./logo.png" style="width:40px;height:40px;border-radius:50%"><input id="postText" class="input" placeholder="What's happening in GEAPPLE Holo-verse? #GEAPPLE" style="flex:1"></div><div style="display:grid;grid-template-columns:1fr 1fr 1fr 1fr;gap:6px;margin-top:10px"><button class="btn" style="padding:8px;font-size:11px" onclick="attach('photo')">📸 PHOTO</button><button class="btn" style="padding:8px;font-size:11px;background:linear-gradient(90deg,#ff00ff,#00e5ff)" onclick="attach('video')">🎬 REEL</button><button class="btn" style="padding:8px;font-size:11px;background:linear-gradient(90deg,#ffd700,#ff8c00)" onclick="attach('live')">🔴 LIVE</button><button class="btn" style="padding:8px;font-size:11px" onclick="post()">🚀 POST</button></div><div id="feed"></div></div>
<script>
function post(){let t=document.getElementById('postText').value;if(!t)return;let f=JSON.parse(localStorage.getItem('gea_social_v2')||'[]');f.unshift({id:Date.now(),text:t,user:'GEA-USER-'+Math.floor(Math.random()*9999),time:new Date().toLocaleString(),likes:0,comments:0,shares:0,verified:true});localStorage.setItem('gea_social_v2',JSON.stringify(f));document.getElementById('postText').value='';render()}
function like(i){let f=JSON.parse(localStorage.getItem('gea_social_v2')||'[]');f[i].likes++;localStorage.setItem('gea_social_v2',JSON.stringify(f));render()}
function render(){let f=JSON.parse(localStorage.getItem('gea_social_v2')||'[]');document.getElementById('feed').innerHTML=f.map((p,i)=>`<div class=post><div style="display:flex;align-items:center;gap:8px"><img src="./logo.png" style="width:32px;height:32px;border-radius:50%;border:1px solid #00ff88"><b>${p.user}</b> <span style="color:#00ff88;font-size:10px">✓ VERIFIED</span><small style="margin-left:auto;color:#666">${p.time}</small></div><p style="margin:10px 0">${p.text}</p><div style="display:flex;gap:15px;color:#aaa;font-size:13px"><span onclick="like(${i})" style="cursor:pointer">❤️ ${p.likes}</span><span>💬 ${p.comments}</span><span>🔁 ${p.shares}</span><span style="margin-left:auto">🔖 SAVE</span></div></div>`).join('')||'<p style="text-align:center;color:#666">No holo posts yet — Be first!</p>'}
function attach(t){alert(t.toUpperCase()+' — Creators Tool Connected to REELGEA (App 2) + GEA-PAY Monetization — Upload via GEA-STORE'); if(t=='video')location.href='./2-reelgea.html'}
render();
</script></body></html>
