<img src="./logo.png" class="logo"><div style="text-align:center"><h2 style="color:#ff00ff">2- REELGEA®™ CREATORS STUDIO PRO MAX</h2><p style="font-size:10px;color:#aaa">RC:9882150 | CEO: Apostle Dr Oladele Mighty Hassan PhD/DD | 4K HOLO EDITOR</p></div>

<div class="holo"><h3 style="color:#ff00ff;margin:0 0 10px">🎬 CREATORS TOOLS — SUPER STUDIO</h3><div style="display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px">

<div class="tool" onclick="tool('text')">🔤<br><small>HOLO TEXT</small></div><div class="tool" onclick="tool('ai')">🤖<br><small>GSIA-AI EFFECT</small></div><div class="tool" onclick="tool('speed')">⚡<br><small>SPEED</small></div>
</div>
<input type=file id="vid" accept="video/*" style="display:none" onchange="preview()"><button class="btn" onclick="document.getElementById('vid').click()">📤 UPLOAD 4K REEL — MAX 90s</button>
<video id="preview" controls style="width:100%;border-radius:18px;margin-top:10px;display:none"></video>

</div>

<div class="holo"><h3>🔥 HOLO FEED — VERTICAL SWIPE</h3><div id="reels" style="max-height:400px;overflow:auto"></div></div>

<script>
function tool(t){alert('CREATOR TOOL: '+t.toUpperCase()+' — Connected to GSIA-AI (App 20) + GEATUNE (App 11) — Pro Max Rendering')}
function preview(){let f=document.getElementById('vid').files[0];if(!f)return;let v=document.getElementById('preview');v.src=URL.createObjectURL(f);v.style.display='block'}
function publish(){
 let cap=document.getElementById('caption').value;if(!cap)return alert('Add caption');
 let r={id:Date.now(),cap:cap,time:new Date().toLocaleString(),views:Math.floor(Math.random()*1000),likes:0,earnings:0};
 let list=JSON.parse(localStorage.getItem('reelgea_v2')||'[]');list.unshift(r);localStorage.setItem('reelgea_v2',JSON.stringify(list));
 alert('✅ REEL PUBLISHED — Earnings linked to GEA-PAY Wallet — CEO will boost via ADVERT BROADCAST');
 render(); document.getElementById('caption').value='';
}
function render(){let list=JSON.parse(localStorage.getItem('reelgea_v2')||'[]');document.getElementById('reels').innerHTML=list.map(x=>`<div style="border:1px solid #ff00ff44;padding:10px;border-radius:15px;margin:8px 0"><b>HOLO REEL ${x.id.toString().slice(-4)}</b> — ${x.time}<br>${x.cap}<br><small>👁️ ${x.views} | ❤️ ${x.likes} | 💰 ₦${x.earnings} — Monetized via GEA-PAY</small></div>`).join('')||'<small style="color:#666">No reels yet</small>'}
render();
