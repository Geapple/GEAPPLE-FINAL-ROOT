name: UNZIP GEAPPLE 33
on: push
permissions:
  contents: write
jobs:
  unzip:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: |
          if [ -f GEAPPLE_33.zip ]; then
            unzip -o GEAPPLE_33.zip
            rm GEAPPLE_33.zip
            ls *.html
          else
            echo "ZIP not found in root - waiting for upload"
            ls -la
            exit 1
          fi
      - run: |
          git config user.name "Geapple Bot"
          git config user.email "bot@geapple.com"
          git add *.html
          git commit -m "AUTO-EXTRACT 33 APPS V3 96%" || echo "done"
          git push
