<!DOCTYPE html><html><head><meta name="viewport" content="width=device-width,initial-scale=1"><title>GEA-STORE</title>
<style>body{background:#000;color:#00ff88;font-family:sans-serif;margin:0}.tabs{display:flex;position:fixed;bottom:0;width:100%;background:#000;border-top:2px solid #00ff88}.tabs button{flex:1;padding:14px;background:#000;color:#00ff88;border:none}.tab{display:none;padding:10px;padding-bottom:70px}.active{display:block}.holo{border:1px solid #00ff88;border-radius:15px;padding:10px;margin:8px 0;background:#0a0a0a}.logo{width:60px;height:60px;border-radius:50%;border:2px solid #00ff88;box-shadow:0 0 15px #00ff88;display:block;margin:10px auto}</style></head><body>
<img src="./logo.png" class="logo"><div style="text-align:center"><h2>17- GEA-STORE®™ — SUPER STORE</h2></div>
<div id="t1" class="tab active"><div class="holo"><h3>📱 TAB1: BROWSE 35 APPS ECOSYSTEM</h3><div id="apps" style="display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px"></div></div></div>
<div id="t2" class="tab"><div class="holo"><h3>🛒 TAB2: MARKETPLACE — UPLOAD PRODUCT (Needs GEA-PAY N500)</h3>
<input id="pname" placeholder="Product Name" style="width:95%;padding:10px;background:#000;border:1px solid #00ff88;color:#fff;border-radius:8px"><input id="pprice" type=number placeholder="Price ₦" style="width:95%;padding:10px;margin:8px 0;background:#000;border:1px solid #00ff88;color:#fff;border-radius:8px"><textarea id="pdesc" placeholder="Description" style="width:95%;padding:10px;background:#000;border:1px solid #00ff88;color:#fff;border-radius:8px"></textarea>
<button onclick="uploadProd()" style="width:100%;padding:12px;background:linear-gradient(90deg,#00ff88,#00ccff);border:none;border-radius:20px;font-weight:bold;margin-top:10px">⬆️ UPLOAD — PAY VIA GEA-PAY</button></div></div>
<div id="t3" class="tab"><div class="holo"><h3>📦 TAB3: MY PRODUCTS — CEO APPROVAL STATUS</h3><div id="myprods"></div></div></div>
<div class="tabs"><button onclick="show('t1')">📱 BROWSE</button><button onclick="show('t2')">🛒 MARKET</button><button onclick="show('t3')">📦 MY PRODUCTS</button></div>
<script>
const APPS=[...Array(35)].map((_,i)=>`${i+1}`);
function show(id){document.querySelectorAll('.tab').forEach(t=>t.classList.remove('active'));document.getElementById(id).classList.add('active');if(id=='t3')renderMy();if(id=='t1')renderApps()}
function renderApps(){document.getElementById('apps').innerHTML=APPS.map(n=>`<div style="text-align:center;border:1px solid #00ff88;border-radius:12px;padding:8px"><img src="./logo.png" style="width:40px;height:40px;border-radius:50%"><br><small>${n}</small></div>`).join('')}
function uploadProd(){
 let prod={id:Date.now(),name:pname.value,price:pprice.value,desc:pdesc.value,status:'AWAITING_PAYMENT',time:new Date().toLocaleString()};
 if(!prod.name||!prod.price)return alert('Fill name & price');
 localStorage.setItem('pending_product',JSON.stringify(prod));
 alert('Product saved — Redirecting to GEA-PAY (App 29) to pay N500 listing fee');
 window.location.href='./29-gea-pay.html';
}
function renderMy(){
 let prods=JSON.parse(localStorage.getItem('gea_products')||'[]');
 let ceoApproved=JSON.parse(localStorage.getItem('ceo_approved_products')||'[]');
 let all=[...prods,...ceoApproved];
 document.getElementById('myprods').innerHTML=all.length?all.map(p=>`<div class=holo><b>${p.name}</b> — ₦${p.price}<br><small>${p.desc}</small><br>Status: <b style="color:${p.status=='APPROVED'?'#00ff88':'orange'}">${p.status}</b> — Code: ${p.payCode||'N/A'}</div>`).join(''):'No products yet. Go to MARKET tab.';
}
// Check if returned from GEA-PAY with payment
let payTx=JSON.parse(localStorage.getItem('gea_pay_tx')||'[]').find(x=>x.type=='store_listing'&&x.status=='PENDING_CEO');
if(payTx){let pend=JSON.parse(localStorage.getItem('pending_product')||'null');if(pend){pend.payCode=payTx.code;pend.status='PENDING_CEO_APPROVAL';let list=JSON.parse(localStorage.getItem('gea_products')||'[]');list.unshift(pend);localStorage.setItem('gea_products',JSON.stringify(list));localStorage.removeItem('pending_product');}}
renderApps();
</script></body></html>
